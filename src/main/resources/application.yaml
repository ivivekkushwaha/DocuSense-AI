
spring:
  application:
    name: DocuSense-AI

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:docusense}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Vivek@2005}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 1536

    vectorstore:
      pgvector:
        index-type: none
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        schema-name: ${PGVECTOR_SCHEMA_NAME:public}
        initialize-schema: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 50MB
